<!DOCTYPE html>
<html>

<head>

<title>Messages - JobBridge Admin</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#f4f6f9;

}



.main{

width:90%;

margin:40px auto;

}



h1{

margin-bottom:25px;

color:#1f2937;

}



.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 20px rgba(0,0,0,0.1);

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#2563eb;

color:white;

padding:14px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

}



.message{

max-width:300px;

}



.btn{

padding:8px 15px;

background:#2563eb;

color:white;

text-decoration:none;

border-radius:6px;

}



</style>


</head>



<body>


<div class="main">


<h1>
Admin Messages
</h1>



<div class="card">



<table>


<thead>

<tr>

<th>ID</th>

<th>Sender</th>

<th>Receiver</th>

<th>Message</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>



<tbody>



{% if messages %}



{% for msg in messages %}



<tr>


<td>
{{ msg[0] }}
</td>


<td>
{{ msg[1] }}
</td>


<td>
{{ msg[2] }}
</td>


<td class="message">

{{ msg[3] }}

</td>


<td>
{{ msg[4] }}
</td>


<td>


<a href="/admin/view_message/{{ msg[0] }}"
class="btn">

View

</a>


</td>


</tr>



{% endfor %}



{% else %}


<tr>

<td colspan="6">

No messages found

</td>

</tr>


{% endif %}



</tbody>


</table>


</div>


</div>


</body>


</html>
