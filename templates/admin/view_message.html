<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>View Message - JobBridge Admin</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f4f6f9;

}



.main{

width:80%;

margin:40px auto;

}



h1{

color:#1f2937;

margin-bottom:25px;

}




.card{

background:white;

padding:35px;

border-radius:15px;

box-shadow:0 5px 20px rgba(0,0,0,0.1);

}




.card h2{

color:#2563eb;

margin-bottom:25px;

}



.info p{

font-size:16px;

margin:15px 0;

line-height:1.6;

}



.info b{

display:inline-block;

width:150px;

color:#111827;

}



.message-box{

margin-top:25px;

background:#f8fafc;

padding:20px;

border-radius:10px;

font-size:17px;

line-height:1.6;

}





.btn{

display:inline-block;

margin-top:25px;

padding:12px 25px;

background:#2563eb;

color:white;

text-decoration:none;

border-radius:8px;

}



.btn:hover{

background:#1d4ed8;

}



</style>


</head>


<body>


<div class="main">


<h1>
Message Details
</h1>




{% if message %}



<div class="card">


<h2>
Conversation
</h2>



<div class="info">


<p>

<b>Sender:</b>

{{ message[1] }}

</p>



<p>

<b>Sender Email:</b>

{{ message[2] }}

</p>




<p>

<b>Receiver:</b>

{{ message[3] }}

</p>




<p>

<b>Receiver Email:</b>

{{ message[4] }}

</p>




<p>

<b>Date:</b>

{{ message[6] }}

</p>



</div>




<h3>
Message
</h3>



<div class="message-box">

{{ message[5] }}

</div>




<a href="/admin/messages" class="btn">

← Back to Messages

</a>




</div>




{% else %}


<div class="card">

<h2>

Message Not Found

</h2>


<a href="/admin/messages" class="btn">

Back

</a>


</div>


{% endif %}



</div>


</body>

</html>
