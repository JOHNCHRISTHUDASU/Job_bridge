<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | JobBridge</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.container{
width:90%;
max-width:900px;
margin:40px auto;
}

/* Header */

.header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:25px;
}

.header h1{
color:#2563eb;
}

/* Right Header */

.header-right{
display:flex;
align-items:center;
gap:12px;
}

/* Language */

#languageSelector{
padding:8px 12px;
border-radius:8px;
border:1px solid #ddd;
cursor:pointer;
}

/* Back Button */

.back-btn{
text-decoration:none;
background:#2563eb;
color:#fff;
padding:10px 18px;
border-radius:8px;
transition:.3s;
}

.back-btn:hover{
background:#1d4ed8;
}

/* Card */

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

/* Notification */

.notification{
padding:18px;
border-left:5px solid #2563eb;
background:#f9fafb;
border-radius:8px;
}

.notification p{
margin-bottom:10px;
font-size:16px;
color:#333;
line-height:1.5;
}

.notification small{
color:#666;
}

/* Empty */

.empty{
text-align:center;
padding:50px;
color:#888;
}

.empty i{
font-size:60px;
margin-bottom:15px;
color:#2563eb;
}

.empty h2{
margin-bottom:10px;
}

/* Mobile */

@media(max-width:768px){

.header{
flex-direction:column;
align-items:flex-start;
}

.header-right{
width:100%;
justify-content:space-between;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

<i class="fa-solid fa-bell"></i>

<span data-lang="notifications">

Notifications

</span>

</h1>

<div class="header-right">

<select id="languageSelector">

<option value="en">🌐 English</option>
<option value="te">🌐 తెలుగు</option>
<option value="hi">🌐 हिन्दी</option>

</select>

<a href="/jobseeker/dashboard" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

<span data-lang="dashboard">

Dashboard

</span>

</a>

</div>

</div>

{% if notifications %}

{% for n in notifications %}

<div class="card">

<div class="notification">

<p>

{{ n[0] }}

</p>

<small>

<i class="fa-solid fa-clock"></i>

{{ n[1] }}

</small>

</div>

</div>

{% endfor %}

{% else %}

<div class="card">

<div class="empty">

<i class="fa-solid fa-bell-slash"></i>

<h2 data-lang="no_notifications">

No Notifications

</h2>

<p data-lang="no_notifications_desc">

You don't have any notifications from the administrator.

</p>

</div>

</div>

{% endif %}

</div>

<!-- Language Script -->

<script src="{{ url_for('static', filename='js/modules/language.js') }}"></script>

</body>

</html>
