<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analytics | JobBridge</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f4f8ff;
}

.container{
width:90%;
max-width:1100px;
margin:40px auto;
}

/* Header */

.header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
margin-bottom:35px;
gap:15px;
}

.header h1{
color:#0d6efd;
}

.header-right{
display:flex;
align-items:center;
gap:12px;
}

#languageSelector{

padding:8px 12px;
border-radius:8px;
border:1px solid #ccc;
cursor:pointer;

}

.back{

padding:10px 18px;
background:#0d6efd;
color:#fff;
text-decoration:none;
border-radius:8px;

}

.back:hover{

background:#084298;

}

/* Cards */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;

}

.card{

background:#fff;
border-radius:18px;
padding:30px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
transition:.3s;

}

.card:hover{

transform:translateY(-8px);

}

.card i{

font-size:45px;
color:#0d6efd;
margin-bottom:15px;

}

.card h2{

font-size:40px;
margin-bottom:10px;
color:#222;

}

.card p{

font-size:18px;
color:#666;

}

@media(max-width:768px){

.header{

flex-direction:column;
align-items:flex-start;

}

.header-right{

width:100%;
justify-content:space-between;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

<i class="fa-solid fa-chart-line"></i>

<span data-lang="analytics">

My Analytics

</span>

</h1>

<div class="header-right">

<select id="languageSelector">

<option value="en">🌐 English</option>
<option value="te">🌐 తెలుగు</option>
<option value="hi">🌐 हिन्दी</option>

</select>

<a href="/jobseeker/dashboard" class="back">

<i class="fa-solid fa-arrow-left"></i>

<span data-lang="dashboard">

Dashboard

</span>

</a>

</div>

</div>

<div class="cards">

<div class="card">

<i class="fa-solid fa-file-lines"></i>

<h2>{{ total }}</h2>

<p data-lang="total_applications">

Total Applications

</p>

</div>

<div class="card">

<i class="fa-solid fa-clock"></i>

<h2>{{ pending }}</h2>

<p data-lang="pending">

Pending

</p>

</div>

<div class="card">

<i class="fa-solid fa-circle-check"></i>

<h2>{{ accepted }}</h2>

<p data-lang="accepted">

Accepted

</p>

</div>

<div class="card">

<i class="fa-solid fa-calendar-check"></i>

<h2>{{ interviews }}</h2>

<p data-lang="interviews_scheduled">

Interviews Scheduled

</p>

</div>

<div class="card">

<i class="fa-solid fa-circle-xmark"></i>

<h2>{{ rejected }}</h2>

<p data-lang="rejected">

Rejected

</p>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/modules/language.js') }}"></script>

</body>

</html>
