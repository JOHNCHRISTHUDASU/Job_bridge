<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employer Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#ECE5DD;
}
.chat-container{
    width:70%;
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.chat-header{
    background:#0d6efd;
    color:white;
    padding:20px;
}

.chat-header h2{
    font-size:24px;
}

.chat-header p{
    margin-top:6px;
    opacity:.95;
    font-size:16px;
}

.chat-body{
    height:450px;
    overflow-y:auto;
    padding:20px;
    background:#eef3f8;
}

/* ================= Messages ================= */

.message{
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
}

.sent{
    align-items:flex-end;
}

.received{
    align-items:flex-start;
}

.bubble{
    max-width:70%;
    padding:12px 16px;
    border-radius:18px;
    word-wrap:break-word;
    line-height:1.5;
}

.sent .bubble{
    background:#0d6efd;
    color:#fff;
    border-bottom-right-radius:5px;
}

.received .bubble{
    background:#fff;
    color:#333;
    border:1px solid #ddd;
    border-bottom-left-radius:5px;
}

.message small{
    margin-top:6px;
    font-size:11px;
    color:#777;
}

/* ================= Footer ================= */

.chat-footer{
    display:flex;
    gap:10px;
    padding:20px;
    border-top:1px solid #ddd;
    background:#fff;
}

textarea{
    flex:1;
    resize:none;
    height:60px;
    border:1px solid #ccc;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#0d6efd;
}

button{
    width:130px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#084298;
}

.empty{
    text-align:center;
    color:gray;
    margin-top:150px;
}


.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:bold;
}

.profile-pic{
    width:50px;
    height:50px;
    border-radius:50%;
    border:2px solid white;
    object-fit:cover;
}

.header-left h2{
    font-size:20px;
    margin:0;
}

.header-left p{
    margin:0;
    font-size:13px;
    opacity:.9;
}

.chat-container{
    width:70%;
    max-width:900px;
    height:88vh;
    display:flex;
    flex-direction:column;
}

</style>

</head>

<body>

<div class="chat-container">

    <div class="chat-header">

    <div class="header-left">

        <a href="javascript:history.back()" class="back-btn">
            ←
        </a>

        <img src="{{ url_for('static', filename='images/default.png') }}"
             class="profile-pic">

        <div>

            <h2>{{ receiver_name }}</h2>

            <p>🟢 Online</p>

        </div>

    </div>

</div>

    <div class="chat-body">

    {% if chats %}

        {% for chat in chats %}

            {% if chat[0] == session["user_id"] %}

                <div class="message sent">

                    <div class="bubble">
                        {{ chat[2] }}
                    </div>

                    <small>
                        {{ chat[3] }}
                    </small>

                </div>

            {% else %}

                <div class="message received">

                    <div class="bubble">
                        {{ chat[2] }}
                    </div>

                    <small>
                        {{ chat[3] }}
                    </small>

                </div>

            {% endif %}

        {% endfor %}

    {% else %}

        <div class="empty">

            <h3>No messages yet</h3>

            <p>Start the conversation.</p>

        </div>

    {% endif %}

</div>

    <form action="/send_message" method="POST">

        <input
            type="hidden"
            name="receiver_id"
            value="{{ receiver_id }}">

        <div class="chat-footer">

            <textarea
                name="message"
                placeholder="Type your message..."
                required></textarea>

            <button type="submit">
                Send
            </button>

        </div>

    </form>

</div>

</body>

</html>
