<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employer Notifications | JobBridge</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.container{
width:90%;
max-width:900px;
margin:40px auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.header h1{
color:#2563eb;
}

.back-btn{
text-decoration:none;
background:#2563eb;
color:#fff;
padding:10px 18px;
border-radius:8px;
transition:.3s;
}

.back-btn:hover{
background:#1d4ed8;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.notification{
padding:18px;
border-left:5px solid #2563eb;
background:#f9fafb;
margin-bottom:15px;
border-radius:8px;
}

.notification p{
margin-bottom:8px;
font-size:16px;
color:#333;
}

.notification small{
color:#777;
}

.empty{
text-align:center;
padding:50px;
color:#888;
}

.empty i{
font-size:60px;
margin-bottom:15px;
color:#2563eb;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

<i class="fa-solid fa-bell"></i>

Employer Notifications

</h1>

<a href="/employer/dashboard" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

{% if notifications %}

{% for n in notifications %}

<div class="card">

<div class="notification">

<p>

{{ n[0] }}

</p>

<small>

<i class="fa-solid fa-clock"></i>

{{ n[1] }}

</small>

</div>

</div>

{% endfor %}

{% else %}

<div class="card">

<div class="empty">

<i class="fa-solid fa-bell-slash"></i>

<h2>No Notifications</h2>

<p>

You don't have any notifications from the administrator.

</p>

</div>

</div>

{% endif %}

</div>

</body>

</html>
