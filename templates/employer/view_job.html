<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>View Job | Job_Bridge</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#eef3fb;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h1{
color:#0d6efd;
margin-bottom:30px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
}

td{
padding:15px;
border-bottom:1px solid #ddd;
}

td:first-child{
font-weight:bold;
width:220px;
background:#f7f9fc;
}

.back{
display:inline-block;
margin-top:30px;
padding:12px 20px;
background:#0d6efd;
color:white;
text-decoration:none;
border-radius:10px;
}

.back:hover{
background:#0b5ed7;
}

</style>

</head>

<body>

<div class="container">

<h1>Job Details</h1>

<table>

<tr>
<td>Job Title</td>
<td>{{job[2]}}</td>
</tr>

<tr>
<td>Category</td>
<td>{{job[3]}}</td>
</tr>

<tr>
<td>Location</td>
<td>{{job[4]}}</td>
</tr>

<tr>
<td>Salary</td>
<td>{{job[5]}}</td>
</tr>

<tr>
<td>Experience</td>
<td>{{job[6]}}</td>
</tr>

<tr>
<td>Job Type</td>
<td>{{job[7]}}</td>
</tr>

<tr>
<td>Vacancies</td>
<td>{{job[8]}}</td>
</tr>

<tr>
<td>Required Skills</td>
<td>{{job[9]}}</td>
</tr>

<tr>
<td>Description</td>
<td>{{job[10]}}</td>
</tr>

<tr>
<td>Application Deadline</td>
<td>{{job[11]}}</td>
</tr>

<tr>
<td>Status</td>
<td>{{job[12]}}</td>
</tr>

<tr>
<td>Posted On</td>
<td>{{job[13]}}</td>
</tr>

</table>

<a href="/my_jobs" class="back">
← Back to My Jobs
</a>

</div>

</body>

</html>
